# Local Postgres for development / small-team production.
#   docker compose up -d
#   export DATABASE_URL=postgres://bdsp:bdsp@localhost:5432/bdsp
#   python manage.py migrate && python manage.py seed
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bdsp
      POSTGRES_PASSWORD: bdsp
      POSTGRES_DB: bdsp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
