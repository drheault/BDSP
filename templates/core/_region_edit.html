<tr id="region-{{ region.pk }}"><td colspan="4"><form hx-post="{% url 'region_edit' region.pk %}" hx-target="#regions" class="inline-form">
  <div class="field narrow" style="flex-basis:80px"><label>Code</label>{{ form.code }}</div><div class="field"><label>Name</label>{{ form.name }}</div><div class="field narrow"><label>Kind</label>{{ form.kind }}</div><div class="field narrow"><label>Country folder</label>{{ form.country }}</div>
  <div class="field check narrow">{{ form.is_active }}<label>Active</label></div>
  <button class="btn btn-primary btn-sm">Save</button><button type="button" class="btn btn-ghost btn-sm" hx-get="{% url 'company_settings' %}" hx-select="#regions > *" hx-target="#regions">Cancel</button></form>{% if form.errors %}<div class="errorlist">{{ form.errors }}</div>{% endif %}</td></tr>
