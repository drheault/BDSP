<tr id="currency-{{ currency.pk }}" {% if not currency.is_active %}style="opacity:.5"{% endif %}>
  <td><strong>{{ currency.code }}</strong>{% if profile.default_currency_id == currency.pk %} <span class="badge badge-won">default</span>{% endif %}{% if not currency.is_active %} <span class="badge">inactive</span>{% endif %}</td>
  <td>{{ currency.name }}</td><td>{{ currency.symbol }}</td><td class="num">{{ currency.rate_to_base }}</td>
  <td class="row-actions">{% if profile.default_currency_id != currency.pk and currency.is_active %}<button class="btn btn-xs" hx-post="{% url 'currency_make_default' currency.pk %}" hx-target="#currencies">Make default</button>{% endif %}
  <button class="btn btn-xs" hx-get="{% url 'currency_edit' currency.pk %}" hx-target="#currency-{{ currency.pk }}" hx-swap="outerHTML">Edit</button>
  <button class="btn btn-xs btn-danger" hx-post="{% url 'currency_delete' currency.pk %}" hx-confirm="Remove {{ currency.code }}? Currencies in use are deactivated instead." hx-target="#currencies">×</button></td></tr>
