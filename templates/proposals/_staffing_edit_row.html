<tr id="line-{{ line.pk }}"><td colspan="6">
  <form hx-post="{% url 'staffing_edit' line.pk %}" hx-target="#staffing" hx-swap="innerHTML" class="inline-form" hx-on::after-request="if(event.detail.successful){htmx.ajax('GET','{% url 'proposal_fee' line.proposal_id %}',{target:'#fee-summary',select:'#fee-summary > *',swap:'innerHTML'})}">
    <div class="field"><label>Role</label>{{ form.role }}</div><div class="field"><label>Task / phase</label>{{ form.task }}</div>
    <div class="field narrow"><label>Hours</label>{{ form.hours }}</div><div class="field narrow"><label>Rate</label>{{ form.rate }}</div>
    <button class="btn btn-primary btn-sm">Save</button><button type="button" class="btn btn-ghost btn-sm" hx-get="{% url 'staffing_row' line.pk %}" hx-target="#line-{{ line.pk }}" hx-swap="outerHTML">Cancel</button>
  </form>{% if form.errors %}<div class="errorlist">{{ form.errors }}</div>{% endif %}
</td></tr>
