<div class="section-card editing" id="section-{{ section.pk }}">
  <form hx-post="{% url 'section_edit' section.pk %}" hx-target="#section-{{ section.pk }}" hx-swap="outerHTML">
    <div class="sc-head"><span class="n">{{ section.order|add:1 }}</span><div style="flex:1">{{ form.title }}</div>
      <button class="btn btn-sm btn-primary">Save</button>
      <button type="button" class="btn btn-sm btn-ghost" hx-get="{% url 'section_card' section.pk %}" hx-target="#section-{{ section.pk }}" hx-swap="outerHTML">Cancel</button></div>
    <div class="card-body">{{ form.body }}{% if form.errors %}<div class="errorlist">{{ form.errors }}</div>{% endif %}</div>
  </form>
</div>
