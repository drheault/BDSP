<tr id="service-{{ service.pk }}" {% if not service.is_active %}style="opacity:.5"{% endif %}>
  <td><strong>{{ service.name }}</strong>{% if service.description %}<br><small>{{ service.description }}</small>{% endif %}{% if not service.is_active %} <span class="badge">inactive</span>{% endif %}</td>
  <td><span class="badge badge-{{ service.category }}">{{ service.get_category_display }}</span></td>
  <td class="row-actions">{% if can.manage_projects_library %}<button class="btn btn-xs" hx-get="{% url 'service_edit' service.pk %}" hx-target="#service-{{ service.pk }}" hx-swap="outerHTML">{% include "includes/icons.html" with name="edit" %} Edit</button>
  <details class="menu"><summary class="btn btn-xs btn-icon">{% include "includes/icons.html" with name="dots" %}</summary><div class="menu-items"><button class="danger" hx-post="{% url 'service_delete' service.pk %}" hx-confirm="Delete “{{ service.name }}”?" hx-target="#services">{% include "includes/icons.html" with name="trash" %} Delete</button></div></details>{% endif %}</td></tr>
