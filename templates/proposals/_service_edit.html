<tr id="service-{{ service.pk }}"><td colspan="3"><form hx-post="{% url 'service_edit' service.pk %}" hx-target="#services" class="inline-form">
  <div class="field"><label>Name</label>{{ form.name }}</div><div class="field"><label>Category</label>{{ form.category }}</div>
  <div class="field" style="flex-basis:100%"><label>Description</label>{{ form.description }}</div>
  <div class="field check narrow">{{ form.is_active }}<label>Active</label></div>
  <button class="btn btn-primary btn-sm">Save</button><button type="button" class="btn btn-ghost btn-sm" hx-get="{% url 'library' %}" hx-select="#services > *" hx-target="#services">Cancel</button></form></td></tr>
