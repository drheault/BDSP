{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><div><div class="crumbs"><a href="{% url 'client_list' %}">Clients</a> /</div><h1>{{ title }}</h1></div></div>
<div class="card" style="max-width:760px"><div class="card-body"><form method="post">{% csrf_token %}
{% include "includes/form.html" with full_fields=",address,notes," %}
<div class="form-actions"><button class="btn btn-primary">Save client</button><a class="btn btn-ghost" href="{% if client %}{% url 'client_detail' client.pk %}{% else %}{% url 'client_list' %}{% endif %}">Cancel</a></div>
</form></div></div>
{% endblock %}
