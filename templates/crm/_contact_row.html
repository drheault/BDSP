<tr id="contact-{{ contact.pk }}">
  <td><strong>{{ contact.name }}</strong>{% if contact.is_primary %} <span class="badge badge-won">primary</span>{% endif %}</td>
  <td>{{ contact.title|default:"—" }}</td><td>{% if contact.email %}<a href="mailto:{{ contact.email }}">{{ contact.email }}</a>{% else %}—{% endif %}</td><td>{{ contact.phone|default:"—" }}</td>
  <td class="row-actions">{% if can.edit_proposals %}<button class="btn btn-xs" hx-get="{% url 'contact_edit' contact.pk %}" hx-target="#contact-{{ contact.pk }}" hx-swap="outerHTML">{% include "includes/icons.html" with name="edit" %} Edit</button>
  <details class="menu"><summary class="btn btn-xs btn-icon">{% include "includes/icons.html" with name="dots" %}</summary><div class="menu-items"><button class="danger" hx-post="{% url 'contact_delete' contact.pk %}" hx-confirm="Remove {{ contact.name }}?" hx-target="#contact-{{ contact.pk }}" hx-swap="outerHTML swap:150ms">{% include "includes/icons.html" with name="trash" %} Remove contact</button></div></details>{% endif %}</td>
</tr>
